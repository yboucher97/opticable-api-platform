name: Deploy Durable Control Plane

on:
  push:
    branches: [main]
    paths:
      - "apps/control-plane-worker/**"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opticable-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/control-plane-worker

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Worker
        run: npm run check

      - name: Verify deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_API_KEY: ${{ secrets.OPTICABLE_CONTROL_PLANE_API_KEY }}
          CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CONTROL_PLANE_API_KEY" || { echo "Missing secret: OPTICABLE_CONTROL_PLANE_API_KEY"; exit 1; }
          test -n "$CORE_API_KEY" || { echo "Missing secret: OPTICABLE_CORE_API_KEY"; exit 1; }

      - name: Provision event queues
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          queues_json="$(npx wrangler queues list --json)"
          echo "$queues_json" | jq -e '.[] | select(.queue_name == "opticable-business-events")' >/dev/null || npx wrangler queues create opticable-business-events
          queues_json="$(npx wrangler queues list --json)"
          echo "$queues_json" | jq -e '.[] | select(.queue_name == "opticable-business-events-dlq")' >/dev/null || npx wrangler queues create opticable-business-events-dlq

      - name: Deploy Worker and Workflow
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/control-plane-worker
          command: deploy

      - name: Publish runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_API_KEY: ${{ secrets.OPTICABLE_CONTROL_PLANE_API_KEY }}
          CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
        run: |
          printf '%s' "$CONTROL_PLANE_API_KEY" | npx wrangler secret put CONTROL_PLANE_API_KEY
          printf '%s' "$CORE_API_KEY" | npx wrangler secret put CORE_API_KEY
