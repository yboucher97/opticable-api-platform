name: Deploy Durable Control Plane

on:
  push:
    branches: [main]
    paths:
      - "apps/control-plane-worker/**"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opticable-control-plane-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/control-plane-worker

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Worker
        run: npm run check

      - name: Verify deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_API_KEY: ${{ secrets.OPTICABLE_CONTROL_PLANE_API_KEY }}
          CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CONTROL_PLANE_API_KEY" || { echo "Missing secret: OPTICABLE_CONTROL_PLANE_API_KEY"; exit 1; }
          test -n "$CORE_API_KEY" || { echo "Missing secret: OPTICABLE_CORE_API_KEY"; exit 1; }

      - name: Provision event queues
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          list_queues() {
            curl --fail --silent --show-error "${auth[@]}" "$api"
          }

          ensure_queue() {
            local name="$1"
            if list_queues | jq -e --arg name "$name" '.result[] | select(.queue_name == $name)' >/dev/null; then
              echo "Queue already exists: $name"
              return 0
            fi
            curl --fail --silent --show-error \
              "${auth[@]}" \
              -H "Content-Type: application/json" \
              -X POST "$api" \
              --data "$(jq -nc --arg queue_name "$name" '{queue_name:$queue_name}')" \
              | jq -e '.success == true' >/dev/null
            echo "Created queue: $name"
          }

          ensure_queue opticable-business-events
          ensure_queue opticable-business-events-dlq

      - name: Deploy Worker and Workflow
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/control-plane-worker
          command: deploy

      - name: Publish runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTROL_PLANE_API_KEY: ${{ secrets.OPTICABLE_CONTROL_PLANE_API_KEY }}
          CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
        run: |
          printf '%s' "$CONTROL_PLANE_API_KEY" | npx wrangler secret put CONTROL_PLANE_API_KEY
          printf '%s' "$CORE_API_KEY" | npx wrangler secret put CORE_API_KEY


      - name: Verify end-to-end event delivery
        shell: bash
        env:
          CONTROL_PLANE_API_KEY: ${{ secrets.OPTICABLE_CONTROL_PLANE_API_KEY }}
          CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
        run: |
          set -euo pipefail
          worker_url="https://opticable-control-plane.yboucher.workers.dev"
          core_url="https://optibrain.opticable.ca"
          event_id="control-plane-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl --fail --silent --show-error "$worker_url/health" \
            | jq -e '.ok == true and .durable_workflows == true and .event_queue == true' >/dev/null

          accepted="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CONTROL_PLANE_API_KEY" \
            -H "Content-Type: application/json" \
            -X POST "$worker_url/v1/events" \
            --data "$(jq -nc --arg event_id "$event_id" '{
              event_id:$event_id,
              event_type:"system.automation.smoke_test",
              source:"internal",
              idempotency_key:$event_id,
              payload:{requested_via:"github-actions-control-plane"}
            }')")"

          echo "$accepted" | jq -e --arg event_id "$event_id"             '.accepted == true and .queued == true and .event_id == $event_id' >/dev/null

          for attempt in $(seq 1 20); do
            runs="$(curl --fail --silent --show-error \
              -H "X-API-Key: $CORE_API_KEY" \
              "$core_url/v1/automation/runs?limit=100")"
            status="$(echo "$runs" | jq -r --arg event_id "$event_id"               '.runs[]? | select(.event_id == $event_id) | .status' | head -n1)"
            if [[ "$status" == "completed" ]]; then
              echo "End-to-end control-plane smoke test completed: $event_id"
              exit 0
            fi
            if [[ "$status" == "failed" || "$status" == "partial" ]]; then
              echo "Smoke workflow reached unexpected status: $status" >&2
              exit 1
            fi
            sleep 3
          done

          echo "Timed out waiting for core automation run: $event_id" >&2
          exit 1
