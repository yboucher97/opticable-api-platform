name: Test Connection Watchdog

on:
  push:
    branches:
      - feature/connection-watchdog-20261112
    paths:
      - "ops/connectivity_watch/**"
      - ".github/workflows/test-connection-watchdog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and offline unit tests
        run: |
          python -m compileall -q ops/connectivity_watch
          python -m unittest discover -s ops/connectivity_watch -p 'test_*.py' -v
