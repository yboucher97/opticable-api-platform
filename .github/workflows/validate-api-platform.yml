name: Validate API Platform

on:
  pull_request:
    paths:
      - "apps/workflow-api/**"
      - "apps/omada-site-service/**"
      - "ops/backup/**"
      - "docs/OPTICABLE_AUTOMATION_MASTER_RUNBOOK.md"
      - "ops/admin/master-runbook.sha256"
      - "deploy/manual-guarded-release.py"
      - "apps/control-plane-worker/**"
      - "install.sh"
      - "deploy/update-production.sh"
      - "deploy/bootstrap-deploy-user.sh"
      - "deploy/production-root-command.sh"
      - "ops/phase6/**"
      - "ops/phase14/**"
      - "ops/phase15/**"
      - "docs/OPTIBRAIN_*.md"
      - "docs/optibrain-*.json"
      - "ops/phase12/systemd/**"
      - ".github/workflows/deploy-api-platform.yml"
      - ".github/workflows/deploy-control-plane.yml"
      - ".github/workflows/monitor-production-health.yml"
      - ".github/workflows/schedule-customer-lifecycle.yml"
      - ".github/workflows/validate-api-platform.yml"
  push:
    branches: [main]
    paths:
      - "apps/workflow-api/**"
      - "apps/omada-site-service/**"
      - "ops/backup/**"
      - "docs/OPTICABLE_AUTOMATION_MASTER_RUNBOOK.md"
      - "ops/admin/master-runbook.sha256"
      - "deploy/manual-guarded-release.py"
      - "apps/control-plane-worker/**"
      - "install.sh"
      - "deploy/update-production.sh"
      - "deploy/bootstrap-deploy-user.sh"
      - "deploy/production-root-command.sh"
      - "ops/phase6/**"
      - "ops/phase14/**"
      - "ops/phase15/**"
      - "docs/OPTIBRAIN_*.md"
      - "docs/optibrain-*.json"
      - "ops/phase12/systemd/**"
      - ".github/workflows/deploy-api-platform.yml"
      - ".github/workflows/deploy-control-plane.yml"
      - ".github/workflows/monitor-production-health.yml"
      - ".github/workflows/schedule-customer-lifecycle.yml"
      - ".github/workflows/validate-api-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/workflow-api

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate current documentation and rebuild contracts
        run: python ../../ops/phase15/validate_contracts.py

      - name: Validate deployment shell scripts
        run: |
          bash -n ../../install.sh
          bash -n ../../deploy/update-production.sh
          bash -n ../../deploy/bootstrap-deploy-user.sh
          bash -n ../../deploy/bootstrap-github-actions-secrets.sh
          bash -n ../../deploy/production-root-command.sh
          bash -n ../../ops/phase6/git-hooks/pre-push

      - name: Verify authoritative runbook digest
        run: |
          python - <<'PYCODE'
          import hashlib
          from pathlib import Path
          root = Path('../..')
          actual = hashlib.sha256((root/'docs/OPTICABLE_AUTOMATION_MASTER_RUNBOOK.md').read_bytes()).hexdigest()
          assert actual == (root/'ops/admin/master-runbook.sha256').read_text().strip(), 'Master runbook digest is stale'
          PYCODE

      - name: Compile Python
        run: python -m compileall -q workflow tests ../../ops/phase6 ../../ops/phase14 ../../deploy/manual-guarded-release.py

      - name: Run automation kernel tests
        run: python -I ../../ops/phase6/validate.py --suite full


  control-plane-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/control-plane-worker

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate durable control-plane Worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm test && npm run check

  omada-containment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/omada-site-service
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
