name: Customer Lifecycle Sign Status

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
      CORE_API_URL: https://optibrain.opticable.ca
    steps:
      - name: Verify API secret
        shell: bash
        run: |
          test -n "$CORE_API_KEY" || { echo "OPTICABLE_CORE_API_KEY is missing" >&2; exit 1; }

      - name: Request contract status poll
        shell: bash
        run: |
          set -euo pipefail
          bucket="$(TZ=America/Toronto date +'%Y-%m-%dT%H')"
          payload="$(jq -nc \
            --arg key "zoho-sign-status-${bucket}" \
            '{event_type:"customer.lifecycle.contract.status_poll.requested",source:"github-scheduler",idempotency_key:$key,payload:{}}')"
          curl --fail --silent --show-error --max-time 30 \
            -H "X-API-Key: $CORE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$CORE_API_URL/v1/automation/events"
