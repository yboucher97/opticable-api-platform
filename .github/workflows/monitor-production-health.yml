name: Monitor OptiBrain Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-production-health.yml"

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
      HEALTH_ISSUE_TITLE: "OptiBrain production health check failing"
    steps:
      - uses: actions/checkout@v6

      - name: Check production endpoints
        id: check
        shell: bash
        run: |
          set +e
          failed=()
          check() {
            local name="$1"
            local url="$2"
            if ! curl --fail --silent --show-error --max-time 15 "$url" >/dev/null; then
              failed+=("$name: $url")
            fi
          }

          check "workflow-api" "https://optibrain.opticable.ca/v1/system/health"
          check "password-pdf" "https://optibrain.opticable.ca/pdf/health"
          check "omada-site" "https://optibrain.opticable.ca/omada/api/health"
          check "control-plane" "https://opticable-control-plane.yboucher.workers.dev/health"

          if [[ -z "$CORE_API_KEY" ]]; then
            failed+=("provider-inventory: missing OPTICABLE_CORE_API_KEY GitHub secret")
          else
            providers="$(curl --fail --silent --show-error --max-time 15               -H "X-API-Key: $CORE_API_KEY"               "https://optibrain.opticable.ca/v1/system/providers" 2>/dev/null || true)"
            if [[ -z "$providers" ]]; then
              failed+=("provider-inventory: authenticated inventory request failed")
            else
              check_provider() {
                local jq_filter="$1"
                local label="$2"
                if ! echo "$providers" | jq -e "$jq_filter" >/dev/null; then
                  failed+=("provider-state: $label")
                fi
              }
              check_provider '.providers.zoho.configured == true and .providers.zoho.connected == true' "Zoho disconnected or unconfigured"
              check_provider '.providers.google_admin.configured == true and .providers.google_admin.connected == true' "Google disconnected or unconfigured"
              check_provider '.providers.windsor.configured == true' "Windsor unconfigured"
              check_provider '.providers.ovhcloud.configured == true' "OVHcloud unconfigured"
              check_provider '.providers.github.configured == true and .providers.github.auth_mode == "github_app"' "GitHub App auth unavailable"
              check_provider '.providers.cloudflare.configured == true' "Cloudflare unconfigured"
              check_provider '.providers.apollo.configured == true and .providers.apollo.credit_consumption_enabled == false' "Apollo unavailable or credit guard changed"
              check_provider '.providers.openai.configured == true and .providers.openai.model_configured == true' "OpenAI unconfigured"
              check_provider '.providers.anthropic.configured == true and .providers.anthropic.model_configured == true' "Anthropic unconfigured"
            fi
          fi

          if (( ${#failed[@]} > 0 )); then
            printf '%s\n' "${failed[@]}" > /tmp/failed-health.txt
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "healthy=true" >> "$GITHUB_OUTPUT"

      - name: Open or update incident issue
        if: steps.check.outputs.healthy == 'false'
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$HEALTH_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"
          body="$(printf 'Automated OptiBrain health check failed at %s UTC.\n\nFailed endpoints:\n\n' "$(date -u +'%Y-%m-%d %H:%M:%S')"; sed 's/^/- /' /tmp/failed-health.txt)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$HEALTH_ISSUE_TITLE" --body "$body"
          fi
          exit 1

      - name: Close recovered incident
        if: steps.check.outputs.healthy == 'true'
        shell: bash
        run: |
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$HEALTH_ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Automated health check recovered at $(date -u +'%Y-%m-%d %H:%M:%S') UTC. All monitored endpoints are healthy."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
