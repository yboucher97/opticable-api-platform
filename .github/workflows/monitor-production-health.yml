name: Monitor OptiBrain Production Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-production-health.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: optibrain-production-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_API_KEY: ${{ secrets.OPTICABLE_CORE_API_KEY }}
      HEALTH_ISSUE_TITLE: "OptiBrain production health check failing"
    steps:
      - uses: actions/checkout@v6

      - name: Check production endpoints
        id: check
        shell: bash
        run: |
          set +e
          failed=()
          check() {
            local name="$1"
            local url="$2"
            if ! curl --fail --silent --show-error --max-time 15 "$url" >/dev/null; then
              failed+=("$name: $url")
            fi
          }

          check "workflow-api" "https://optibrain.opticable.ca/v1/system/health"
          check "password-pdf" "https://optibrain.opticable.ca/pdf/health"
          check "omada-site" "https://optibrain.opticable.ca/omada/api/health"
          check "control-plane" "https://opticable-control-plane.yboucher.workers.dev/health"

          if [[ -z "$CORE_API_KEY" ]]; then
            failed+=("provider-inventory: missing OPTICABLE_CORE_API_KEY GitHub secret")
          else
            provider_body="$(mktemp)"
            provider_code="$(curl --silent --show-error --max-time 15 \
              -o "$provider_body" -w "%{http_code}" \
              -H "X-API-Key: $CORE_API_KEY" \
              "https://optibrain.opticable.ca/v1/system/providers" 2>/dev/null || printf 'curl-error')"
            if [[ "$provider_code" != "200" ]]; then
              failed+=("provider-inventory: authenticated inventory HTTP $provider_code")
            else
              providers="$(cat "$provider_body")"
              check_provider() {
                local jq_filter="$1"
                local label="$2"
                if ! echo "$providers" | jq -e "$jq_filter" >/dev/null; then
                  failed+=("provider-state: $label")
                fi
              }
              check_provider '.providers.zoho.configured == true and .providers.zoho.connected == true' "Zoho disconnected or unconfigured"
              check_provider '.providers.google_admin.configured == true and .providers.google_admin.connected == true' "Google disconnected or unconfigured"
              check_provider '.providers.windsor.configured == true' "Windsor unconfigured"
              check_provider '.providers.ovhcloud.configured == true' "OVHcloud unconfigured"
              check_provider '.providers.github.configured == true and .providers.github.auth_mode == "github_app"' "GitHub App auth unavailable"
              check_provider '.providers.cloudflare.configured == true' "Cloudflare unconfigured"
              check_provider '.providers.apollo.configured == true and .providers.apollo.credit_consumption_enabled == false' "Apollo unavailable or credit guard changed"
              check_provider '.providers.openai.configured == true and .providers.openai.model_configured == true' "OpenAI unconfigured"
              check_provider '.providers.anthropic.configured == true and .providers.anthropic.model_configured == true' "Anthropic unconfigured"
              readiness_body="$(mktemp)"
              readiness_code="$(curl --silent --show-error --max-time 15 -o "$readiness_body" -w "%{http_code}" \
                -H "X-API-Key: $CORE_API_KEY" "https://optibrain.opticable.ca/v1/system/readiness" 2>/dev/null || true)"
              if [[ "$readiness_code" == "200" ]]; then
                # Fail closed on missing, malformed or unexpected readiness signals.
                # UNKNOWN/DEGRADED are non-paging by established policy.
                guard_findings="$(mktemp)"
                guard_rc=0
                python3 ops/health/readiness_guard.py "$readiness_body" > "$guard_findings" 2>/dev/null || guard_rc=$?
                if (( guard_rc != 0 )) && ! grep -q '[^[:space:]]' "$guard_findings"; then
                  failed+=("readiness: parser failed without diagnostic (exit $guard_rc)")
                fi
                while IFS= read -r attention; do
                  [[ -n "$attention" ]] && failed+=("readiness: $attention")
                done < "$guard_findings"
                rm -f "$guard_findings"
              else
                failed+=("readiness: authenticated summary HTTP $readiness_code")
              fi
              rm -f "$readiness_body" "$provider_body"
            fi
          fi

          if (( ${#failed[@]} > 0 )); then
            printf '%s\n' "${failed[@]}" > /tmp/failed-health.txt
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "healthy=true" >> "$GITHUB_OUTPUT"

      - name: Open or update incident issue
        if: steps.check.outputs.healthy == 'false'
        shell: bash
        run: |
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.title == "OptiBrain production health check failing" and .pull_request == null) | .number' \
            | sort -n | head -n 1)"
          body_file="$(mktemp)"
          printf 'Automated OptiBrain health check failed.\n\nFailed endpoints:\n\n' > "$body_file"
          sort -u /tmp/failed-health.txt | sed 's/^/- /' >> "$body_file"
          if [[ -n "$existing" ]]; then
            old_body="$(gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if [[ "$old_body" != "$(cat "$body_file")" ]]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
            fi
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$HEALTH_ISSUE_TITLE" --body-file "$body_file"
          fi
          rm -f "$body_file"
          exit 1

      - name: Close recovered incident
        if: steps.check.outputs.healthy == 'true'
        shell: bash
        run: |
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.title == "OptiBrain production health check failing" and .pull_request == null) | .number' \
            | sort -n | head -n 1)"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Automated health check recovered at $(date -u +'%Y-%m-%d %H:%M:%S') UTC. All monitored endpoints are healthy."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
