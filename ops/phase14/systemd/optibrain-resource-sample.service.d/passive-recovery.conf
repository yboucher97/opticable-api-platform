# Passive observer only. Reuses the existing timer; no repair operation exists.
[Service]
ReadWritePaths=/var/lib/optibrain/autonomous-operations/passive-recovery
ReadWritePaths=/var/lib/optibrain/autonomous-operations/operations-audit.jsonl
ExecStartPost=/usr/bin/python3 -I -B /usr/local/lib/optibrain/recovery-observer.py observe
