[Service]
Environment=PATH=/opt/opticable-api-platform/apps/workflow-api/.venv/bin:/usr/bin:/bin
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/opticable-workflow-api /var/lib/opticable-api-platform/shared
CapabilityBoundingSet=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
UMask=0077
