version: 1
grading:
  A: "90-100: full or near-full programmable configuration + CRUD + event/automation path"
  B: "75-89: strong CRUD/write access with configuration or product-specific gaps"
  C: "60-74: meaningful write actions, but substantial platform/admin gaps"
  D: "40-59: partial API plus browser/UI fallback"
  E: "20-39: read/analytics mainly"
  F: "0-19: not connected or no usable automation path"

