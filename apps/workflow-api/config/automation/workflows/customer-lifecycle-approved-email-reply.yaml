id: customer.lifecycle.approved-email-reply
name: Customer lifecycle approved email reply
version: 2
enabled: false
description: Disabled for Phase 6. Boolean-only approval is unavailable unless separately approved for legacy compatibility. Gate F must explicitly register and route durable single-use approvals before outbound mail is enabled.
trigger:
  event_types:
    - customer.lifecycle.email.reply.approved_to_send
steps:
  - id: send_reply
    action: lifecycle.mail_reply_approved
    with:
      reply: "{{ event.payload }}"
    retry:
      max_attempts: 1
      backoff_seconds: 0
  - id: emit_sent
    action: event.emit
    with:
      event_type: customer.lifecycle.email.reply.sent
      source: optibrain
      payload:
        message_id: "{{ steps.send_reply.message_id }}"
        to_address: "{{ steps.send_reply.to_address }}"
        sent: "{{ steps.send_reply.sent }}"
