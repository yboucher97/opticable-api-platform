intent_rules:
  customer_support:
    signals:
      - existing_customer_or_tenant
      - trouble
      - not_working
      - reconnect
      - access_problem
      - wifi_problem
      - intercom_problem
      - camera_problem
    route: opticable_support_service
    object: support_case_or_service
    required_actions: [identify_customer, identify_site, extract_problem, determine_next_action]

  project_coordination:
    signals:
      - plans_attached
      - installation_date
      - wiring_date
      - finish_date
      - site_access
      - schedule_change
    route: opticable_clients_projects
    object: installation_or_service
    required_actions: [identify_project, extract_dates, extract_scope, determine_next_action]

  quote_or_sales:
    signals:
      - quote_request
      - soumission
      - pricing_request
      - project_inquiry
    route: opticable_leads_quotes
    object: lead_or_deal
    required_actions: [deduplicate, preserve_source, classify_service, determine_next_action]

  supplier_invoice:
    signals:
      - invoice_number
      - facture
      - tax_invoice
      - receipt
      - paid_invoice
    route: supplier_invoices
    object: supplier_invoice_observation
    books_write: false
    required_actions: [identify_supplier, extract_invoice_number, extract_amount_if_present, extract_due_date_if_present, detect_duplicate]

  failed_outbound:
    signals:
      - mailer_daemon
      - delivery_failure
      - undelivered_mail
      - permanent_failure
    route: systems_monitoring
    object: data_quality_exception
    task_rules:
      - create: verify_contact_email_and_retry_strategy
        priority: high

legacy_domain_policy:
  domains: [opti-plex.ca]
  never_disable_automatically: true
  never_delete_alias_automatically: true
  create_migration_candidate_when:
    - provider_or_supplier_sender
    - security_or_account_sender
    - invoice_or_receipt_sender
    - recurring_operational_sender
  do_not_create_migration_candidate_when:
    - human_project_correspondence_and_new_opticable_address_already_present
    - newsletter_only
    - spam_or_marketing_only
  target_rules:
    provider_account: admin@opticable.ca
    supplier_invoice: factures@opticable.ca
    personal_business_correspondence: yboucher@opticable.ca

next_action_defaults:
  urgent_operational_issue_hours: 1
  partner_routed_job_hours: 2
  partner_available_job_hours: 4
  customer_support_hours: 4
  quote_request_hours: 4
  failed_outbound_hours: 2
  supplier_invoice_without_due_date_days: 3
  provider_account_warning_hours: 4

safety:
  delete_mail: false
  move_historical_mail: false
  books_write: false
  books_delete: false
  create_financial_transaction: false
