version: 1
updated_at: "2026-09-26"
mode: observe_then_automate

confidence_policy:
  auto_route_min: 0.95
  auto_task_min: 0.97
  propose_action_min: 0.80
  below_propose_action: leave_in_place

sender_fingerprints:
  support@fieldnation.com:
    category: partner_job_marketplace
    route: opticable_partner_jobs
    confidence: 0.99
    subject_prefixes: ["New Work:", "Routed WO:"]
    extract:
      - work_order_id
      - location
      - postal_code
      - schedule
      - pay_model
      - pay_amount
      - work_type
      - title
      - scope
      - required_tools
      - required_materials
      - status
    task_rules:
      - when: routed_work_order
        create: review_partner_job
        priority: high
      - when: subject_or_body_contains_asap_or_hard_down
        create: urgent_partner_job_review
        priority: urgent
      - when: new_work_available
        create: review_partner_job
        priority: normal

  invoices@infinitecables.com:
    category: supplier_invoice
    route: supplier_invoices
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: factures@opticable.ca
    extract: [invoice_number, attachment_present, supplier]
    books_write: false

  do-not-reply@infinitecables.com:
    category: supplier_shipping
    route: opticable_purchasing
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca
    extract: [order_number, shipment_number, tracking_number, carrier]

  sales@phantomcables.com:
    category: supplier_order
    route: opticable_purchasing
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca
    extract: [order_number, shipment_status]

  support@services.ovhcloud.com:
    category: provider_invoice
    route: supplier_invoices
    confidence: 0.99
    extract: [invoice_number, amount, provider]
    books_write: false

  noreply@notify.cloudflare.com:
    category: provider_invoice_or_system_notice
    route: classify_cloudflare
    confidence: 0.98
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca

  ar.zsc@zohocorp.com:
    category: provider_invoice
    route: supplier_invoices
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca
    books_write: false

  payable@duroequipement.com:
    category: supplier_invoice
    route: supplier_invoices
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: factures@opticable.ca
    books_write: false

  noreply-customer_invoices@guillevin.com:
    category: supplier_invoice
    route: supplier_invoices
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: factures@opticable.ca
    books_write: false

  no.reply@adiglobal.com:
    category: supplier_account_admin
    route: opticable_admin_providers
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca
    action_patterns:
      - account_at_risk
      - account_deactivation
      - credential_or_profile_change

  account-noreply@ui.com:
    category: security_authentication
    route: systems_security
    confidence: 0.99
    legacy_recipient_seen: yboucher@opti-plex.ca
    migration_target: admin@opticable.ca
    task_rules:
      - when: unexpected_authentication_event
        create: security_review
        priority: urgent
